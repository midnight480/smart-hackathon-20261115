  </defs>
  <rect x="0.5" y="0.5" width="479" height="559" rx="12" fill="#ffffff" stroke="#d0d5dd"/>

  <g clip-path="url(#frame)">
    <rect x="24" y="24" width="432" height="320" fill="#eef6f1"/>
    <!-- 背景：掲示板とグラフ -->
    <rect x="300" y="64" width="128" height="100" rx="8" fill="#ffffff" stroke="#c9ddd1" stroke-width="2"/>
    <rect x="320" y="128" width="16" height="22" fill="#9fc9b5"/>
    <rect x="344" y="112" width="16" height="38" fill="#6fae92"/>
    <rect x="368" y="96" width="16" height="54" fill="#15803d"/>
    <rect x="392" y="104" width="16" height="46" fill="#6fae92"/>
