  <rect x="40" y="40" width="80" height="28" rx="14" fill="#15803d"/>
  <text x="80" y="59" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">つなぐ人</text>

  <text x="24" y="390" font-size="24" font-weight="700" fill="#1f2328">山口 真由さん（41）</text>
  <text x="24" y="418" font-size="14" fill="#5b6370">商店街振興組合の事務局／企画と補助金申請の担当</text>
  <line x1="24" y1="440" x2="456" y2="440" stroke="#d0d5dd"/>
  <text x="24" y="472" font-size="16" fill="#1f2328">「イベントが1日で終わらない仕組みと、</text>
  <text x="24" y="498" font-size="16" fill="#1f2328">　効果を示せる数字が欲しい」</text>
  <text x="24" y="534" font-size="12" fill="#5b6370">裏話の代理入力／挑戦数・クーポン使用数の集計</text>
