    <rect x="222" y="218" width="36" height="36" fill="#e9bf99"/>
    <circle cx="178" cy="180" r="11" fill="#e9bf99"/>
    <circle cx="302" cy="180" r="11" fill="#e9bf99"/>
    <circle cx="240" cy="172" r="60" fill="#f3cfad"/>
    <path d="M178 176 Q174 110 240 108 Q306 110 302 176 Q296 140 262 134 Q236 150 200 146 Q184 156 178 176 Z" fill="#3b2a22"/>
    <circle cx="300" cy="150" r="9" fill="#2563eb"/>
