  <rect x="40" y="40" width="72" height="28" rx="14" fill="#2563eb"/>
  <text x="76" y="59" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">巡る人</text>

  <text x="24" y="390" font-size="24" font-weight="700" fill="#1f2328">中村 彩さん（32）・健太さん（34）</text>
  <text x="24" y="418" font-size="14" fill="#5b6370">福岡市在住のカップル／医療事務・IT 企業の営業</text>
  <line x1="24" y1="440" x2="456" y2="440" stroke="#d0d5dd"/>
  <text x="24" y="472" font-size="16" fill="#1f2328">「どこ行く？ もう近場は</text>
  <text x="24" y="498" font-size="16" fill="#1f2328">　行き尽くした感あるよね」</text>
  <text x="24" y="534" font-size="12" fill="#5b6370">ブラウザだけで遊びたい／まず1回勝ちたい</text>
</svg>
